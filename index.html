<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="music-player">
        <img id="song-image" src="resources/shape_of_you.jpg" alt="image">
        <div id="song-name">Song</div>
        <div id="song-artist">Artist</div>
        <input id="slider-song" type="range">
        <div id="music-buttons">
            <i id="shuffle-song" class="fa-solid fa-shuffle"></i>
            <i id="prev-song" class="fa-solid fa-backward-step fa-2x"></i>
            <i id="playpause-song" class="fa-solid fa-circle-play fa-3x"></i>
            <i id="next-song" class="fa-solid fa-forward-step fa-2x"></i>
            <i id="repeat-song" class="fa-solid fa-repeat"></i>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
